name: Deploy JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: JupyterLite 빌드
        run: jupyter lite build --contents content --output-dir dist

      # PROCO 자동 저장 스크립트를 노트북 화면에 끼워 넣습니다.
      # 학생이 셀을 실행하지 않아도 10분마다 mywork.ipynb 가 서버로 저장됩니다.
      - name: 자동 저장 스크립트 삽입
        run: |
          cp proco-autosave.js dist/lab/
          sed -i 's#</head>#<script defer src="proco-autosave.js"></script></head>#' dist/lab/index.html
          grep -q proco-autosave dist/lab/index.html && echo "삽입 확인 완료"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
